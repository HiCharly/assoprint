# Local development only — see README.md ("Démarrage en local").
# Production deployment is native PHP in a Proxmox LXC container: docs/deployment.md.
services:
    app:
        build:
            context: .
            dockerfile: docker/dev/Dockerfile
        image: assoprint-dev
        working_dir: /app
        volumes:
            - .:/app
        ports:
            - '8000:8000'
        command: php artisan serve --host=0.0.0.0 --port=8000

    queue:
        image: assoprint-dev
        depends_on:
            - app
        working_dir: /app
        volumes:
            - .:/app
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
