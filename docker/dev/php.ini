; Development container settings. The production LXC container needs the same
; upload limits — see docs/deployment.md.

; Must stay >= PRINT_MAX_FILE_SIZE_KB (50 Mo by default), otherwise PHP rejects
; the PDF before Laravel validation ever runs.
upload_max_filesize = 64M
post_max_size = 64M

; PHPStan's analysis of the whole application needs more than the 128M default.
memory_limit = 512M

; Le code est monté depuis l'hôte : sans opcache, chaque requête recompile tout
; l'autoloader à travers le montage, ce qui rend le serveur de développement très
; lent. La revalidation reste immédiate, pour que les éditions soient prises en
; compte sans redémarrer le conteneur.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
