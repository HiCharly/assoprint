; Development container settings. The production LXC container needs the same
; upload limits — see docs/deployment.md.

; Must stay >= PRINT_MAX_FILE_SIZE_KB (50 Mo by default), otherwise PHP rejects
; the PDF before Laravel validation ever runs.
upload_max_filesize = 64M
post_max_size = 64M

; PHPStan's analysis of the whole application needs more than the 128M default.
memory_limit = 512M
